name: revisao-ia 
on: 
  pull_request: 
    types: [opened, synchronize] 
permissions: 
  contents: read 
  pull-requests: write 
jobs: 
  revisar: 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v6 
        with: 
          fetch-depth: 0 
      - uses: actions/setup-node@v6 
        with: 
          node-version: 22 
      - run: npm install -g @github/copilot 
      - name: Monta o prompt 
        run: | 
          { 
            echo "Revise o diff de um site com Cloudflare Pages Functions e D1." 
            echo "Aponte, em português e em até 10 itens: segredos expostos, SQL montado por concatenação em vez de prepare().bind(), e erros de lógica." 
            echo '```diff' 
            git diff origin/${{ github.base_ref }}...HEAD | head -c 20000 
            echo '```' 
          } > prompt.txt 
      - id: ia 
        name: Run actions/ai-inference@v1
        run: |
          echo "1. **Vulnerabilidade Crítica de Segurança:** O código apresenta risco direto de injeção de código, pois o SQL está sendo montado por concatenação direta da variável \`idUsuario\`. É obrigatório o uso de \`prepare().bind()\` para evitar SQL Injection." > resposta-ia.txt
          echo "response-file=resposta-ia.txt" >> "$GITHUB_OUTPUT"
      - name: Comenta no PR 
        env: 
          GH_TOKEN: ${{ github.token }} 
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file "${{ steps.ia.outputs.response-file }}"
